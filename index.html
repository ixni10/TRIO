<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="TRIO منصة تعليمية تساعدك على الاستعداد لاختبارات القدرات والتحصيلي.">

    <meta name="theme-color" content="#f8f2e9">

    <title>تسجيل الدخول | TRIO</title>

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- ملف التنسيق -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">
        <!-- TRIO Logo -->


        <!-- محتوى تسجيل الدخول -->
        <section class="login-container" aria-labelledby="welcome-title">
            <a href="index.html" class="login-logo">
        <img src="images/trio-logo.png" alt="TRIO">
    </a>

    <!-- الترحيب -->
    <header class="welcome-section">
            
            

           

            <!-- الترحيب -->
            <header class="welcome-section">

                <h1 id="welcome-title">
                    مرحبًا بعودتك إلى <span>TRIO</span>
                </h1>

                <p>
                    رحلتك نحو التميز تبدأ من هنا
                </p>

            </header>

            <!-- بطاقة تسجيل الدخول -->
            <section class="login-card">

                <div class="card-heading">

                    <h2>تسجيل الدخول</h2>

                    <p>
                        أدخل بياناتك للوصول إلى حسابك في TRIO
                    </p>

                </div>

                <form id="login-form">

                    <!-- البريد الإلكتروني -->
                    <div class="form-group">

                        <label for="email">البريد الإلكتروني</label>

                        <div class="input-wrapper">

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="البريد الإلكتروني"
                                autocomplete="email"
                                required>

                            <span class="input-icon" aria-hidden="true">
                                ✉
                            </span>

                        </div>

                    </div>

                    <!-- كلمة المرور -->
                    <div class="form-group">

                        <label for="password">كلمة المرور</label>

                        <div class="input-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="كلمة المرور"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggle-password"
                                aria-label="إظهار كلمة المرور"
                                aria-pressed="false">

                                <span id="password-icon" aria-hidden="true">◉</span>

                            </button>

                        </div>

                    </div>

                    <!-- استعادة كلمة المرور -->
                    <div class="forgot-password">

                        <a href="forgot-password.html">
                            نسيت كلمة المرور؟
                        </a>

                    </div>

                    <!-- زر تسجيل الدخول -->
                    <button type="submit" class="login-button">

                        <span>تسجيل الدخول</span>

                        <span class="button-arrow" aria-hidden="true">
                            ←
                        </span>

                    </button>

                    <!-- رسائل حالة تسجيل الدخول -->
                    <p
                        id="login-message"
                        class="form-message"
                        role="status"
                        aria-live="polite">
                    </p>

                </form>

                <!-- الانتقال إلى إنشاء الحساب -->
                <div class="register-section">

                    <span class="divider">
                        <span></span>
                        أو
                        <span></span>
                    </span>

                    <p>
                        ليس لديك حساب؟

                        <a href="register.html">
                            إنشاء حساب جديد
                        </a>
                    </p>

                </div>

            </section>

        </section>

        <!-- حقوق التطوير -->
        <footer class="site-footer">
    <span class="footer-line"></span>

    <p dir="ltr">
        TRIO © 2026 — crafted by ixni10
    </p>

    <span class="footer-line"></span>
</footer>

    </main>

   <!-- ملف التفاعلات -->
<script type="module" src="script.js"></script>

</body>

</html>
