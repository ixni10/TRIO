<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الاختبار التشخيصي | TRIO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fbf8f2;
            color: #174875;
        }

        /* عنوان الصفحة */
        .page-header {
            text-align: center;
            padding: 30px 20px 24px;
        }

        .page-header h1 {
            margin: 0 0 12px;
            font-size: 32px;
            font-weight: 700;
            color: #174875;
        }

        .page-header p {
            margin: 0;
            color: #6795c4;
            font-size: 17px;
            line-height: 1.8;
        }

        /* إطار الاختبار */
        .test-container {
            width: min(1000px, calc(100% - 40px));
            margin: 0 auto 40px;
        }

        .test-frame {
            display: block;
            width: 100%;
            height: 850px;
            border: 1px solid #b8d0e4;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 8px 25px rgba(23, 72, 117, 0.10);
        }

        /* تحسين العرض على الجوال */
        @media (max-width: 600px) {
            .page-header {
                padding: 24px 16px 20px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .page-header p {
                font-size: 15px;
            }

            .test-container {
                width: calc(100% - 24px);
                margin-bottom: 24px;
            }

            .test-frame {
                height: 750px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    <header class="page-header">
        <h1>الاختبار التشخيصي</h1>
    
    </header>

    <main class="test-container">
        <iframe
            class="test-frame"
            src="https://forms.cloud.microsoft/pages/responsepage.aspx?id=u1uHtnHzDUiroSlyzgQsKw0-JpiD91BHtwBz06guXihUQzUzV0paOFU1U1BIRjM3UEVZVE9TSk4zWC4u&amp;route=shorturl"
            title="الاختبار التشخيصي لمنصة TRIO"
            loading="lazy">
        </iframe>
    </main>

</body>
</html>
